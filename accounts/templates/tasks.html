<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Название страницы</title>
  </head>
  <body>
    <form method="post">
      {% csrf_token %}
      <input type="text" name="task_input" placeholder="Введите задачу"></input>
      <button type="submit">Добавить</button>
    </form>
    <form method="post" action="{% url 'exit' %}">
      {% csrf_token %}
      <button type="submit">Выйти</button>
    </form>
    {% for task in tasks %}
      <li>{{ task.name }}</li>
      <li>{{ task.create_date|date:"d.m.Y H:i" }}</li>

      <a href="{% url 'edit' task.id %}" class="button">Редактировать</a>

       <form method="post" action="{% url 'delete' task.id %}">
      {% csrf_token %}
      <button type="submit">Удалить</button>
      </form>
      <li>---------------------------------------------------</li>

    {% endfor %}
  </body>
</html>
